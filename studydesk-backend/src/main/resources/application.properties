
spring.application.name=studydesk-backend

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/studydesk
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear y actualizar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Desactivar advertencia de Open In View
spring.jpa.open-in-view=false
